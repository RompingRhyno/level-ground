name = "level-ground-upload-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
# Explicit: a cached OAuth session from the old account otherwise wins the account lookup and the
# deploy fails against the wrong account.
account_id = "319c49fdb7d685313f30b07d52220dcf"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "level-ground"

[vars]
# Comma-separated CORS allowlist; `*.` matches any subdomain. Currently: local dev, LAN device
# testing, the production domain, and any Vercel deployment (previews/aliases).
# Trim to production-only at handoff — see docs/handoff.md.
ALLOWED_ORIGINS = "http://localhost:3000,http://192.168.0.101:3000,https://levelgroundlandscape.com,https://www.levelgroundlandscape.com,https://*.vercel.app"

# Publish on <account>.workers.dev; preview URLs stay off — one public endpoint, not one per deploy.
workers_dev = true
preview_urls = false